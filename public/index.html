<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demogorgon Radar</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Demogorgon Radar</h1>
      <p class="sub">Among-Us style social hunt in a 50m × 50m room</p>

      <section class="panel" id="joinPanel">
        <label>
          Player Name
          <input id="nameInput" maxlength="24" placeholder="Nancy / Hopper / Steve" />
        </label>
        <button id="joinBtn">Join Lobby</button>
      </section>

      <section class="panel hidden" id="gamePanel">
        <div class="row">
          <button id="startBtn">Start Match (Host)</button>
          <button id="resetBtn">Reset (Host)</button>
          <button id="meetingBtn">Emergency Meeting</button>
        </div>

        <div class="status" id="statusText">Waiting in lobby...</div>
        <div class="status" id="roleText">Role: Unassigned</div>
        <div class="status" id="meetingText"></div>

        <div class="radar-wrap">
          <canvas id="radar" width="420" height="420"></canvas>
        </div>

        <div class="controls">
          <button id="gpsBtn">Use Phone GPS</button>
          <button id="simBtn">Simulate Movement</button>
        </div>

        <div class="row">
          <label>X <input type="range" id="xRange" min="0" max="50" step="0.1" /></label>
          <label>Y <input type="range" id="yRange" min="0" max="50" step="0.1" /></label>
        </div>

        <div class="row">
          <select id="targetSelect"></select>
          <button id="eliminateBtn">Eliminate (Demogorgon)</button>
        </div>

        <div class="row">
          <select id="voteSelect"></select>
          <button id="voteBtn">Vote</button>
        </div>

        <div class="row">
          <select id="suspectSelect"></select>
          <button id="identifyBtn">Identify Demogorgon</button>
        </div>

        <ul id="events"></ul>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
